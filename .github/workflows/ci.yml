# <!-- agent-notes: { ctx: "GitHub Actions CI pipeline", deps: [package.json, pnpm-workspace.yaml, scripts/check-canon.mjs], state: canonical, last: "claude@2026-08-08" } -->

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to commit SHAs, not tags (Done Gate 13c). A major-version
      # tag is a moving pointer, so whoever can rewrite it controls what executes in
      # CI — the tj-actions/changed-files compromise of March 2025 worked exactly
      # that way. The trailing comment keeps the version human-readable; the SHA is
      # what actually resolves.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canon consistency
        run: pnpm check:canon

      - name: Build
        run: pnpm build

      # Runs separately from Build on purpose: tsup and vitest are both esbuild-
      # based, and esbuild strips types without checking them. A green build and a
      # green test run say nothing about whether the types hold, which is how the
      # Done Gate's "typecheck passes (deterministic)" item went years without a
      # command behind it (#100).
      - name: Typecheck
        run: pnpm typecheck

      - name: Check repo health (doctor)
        run: pnpm check:doctor

      - name: Run tests
        run: pnpm test
